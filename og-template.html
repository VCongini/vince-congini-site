<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@300&family=Syne:wght@700&display=block" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: #1A1C24;
      font-family: 'DM Sans', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 96px;
      position: relative;
    }
    .accent {
      width: 48px;
      height: 5px;
      background: #2A3A8C;
      border-radius: 3px;
      margin-bottom: 40px;
    }
    .name {
      font-family: 'Syne', system-ui, sans-serif;
      font-weight: 700;
      font-size: 96px;
      letter-spacing: -0.03em;
      line-height: 1.0;
      color: #fff;
      margin-bottom: 24px;
    }
    .title {
      font-weight: 300;
      font-size: 24px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.01em;
      line-height: 1.4;
    }
    .url {
      position: absolute;
      bottom: 48px;
      left: 96px;
      font-family: 'DM Mono', monospace;
      font-size: 16px;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.25);
    }
    .logo {
      position: absolute;
      top: 64px;
      right: 96px;
      font-family: 'Syne', system-ui, sans-serif;
      font-weight: 700;
      font-size: 28px;
      color: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="accent"></div>
  <div class="name">Vincent<br>Congini</div>
  <div class="title">Senior Front End Tech Lead &middot; Full-Stack TypeScript &amp; AI Product Engineering</div>
  <div class="url">vincecongini.com</div>
  <div class="logo">VC.</div>
</body>
</html>
